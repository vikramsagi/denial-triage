<svg xmlns="http://www.w3.org/2000/svg" width="860" height="200" viewBox="0 0 860 200" role="img" aria-label="Feedback loop. Days 1 to 3: Northwind prior authorization, 7 appeals filed, 3.82 wins expected, 1 won. The win odds for that payer and reason were cut to 0.53 times their old value. Days 4 to 7: money lost fell from 211 to 147 USD, and one appeal was written off instead." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
svg{--bg:#FFFFFF;--line:#E3E0F5;--ink:#1F1D2B;--muted:#5E5A72;--a:#8C8899;--b:#6941E6;--warn:#A35F00;--warnsoft:#FBF0DF;--err:#C23434;--errsoft:#FBE7E7;--oksoft:#E2F3EA;--key:#0F8F7A;--soft:#EDE8FF;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){svg{--bg:#1C1A28;--line:#2E2B40;--ink:#EDEBF7;--muted:#A9A5BE;--a:#6E6A80;--b:#A48BFF;--warn:#E8A23A;--warnsoft:#3A2E1A;--err:#F07878;--errsoft:#3A1F24;--oksoft:#1B3328;--key:#3CCFB5;--soft:#2A2250}}
.bg{fill:var(--bg);stroke:var(--line)}.t{fill:var(--ink);font-size:18px;font-weight:600}.st{fill:var(--muted);font-size:13px}
.l{fill:var(--muted);font-size:13px}.lk{fill:var(--ink);font-size:13px;font-weight:600}.v{fill:var(--ink);font-size:12px;font-variant-numeric:tabular-nums}.vk{fill:var(--ink);font-size:12px;font-weight:700}
.sa{fill:var(--a)}.sb{fill:var(--b)}.g{stroke:var(--line)}.r{fill:var(--muted);font-size:12px}.leg{fill:var(--ink);font-size:12px}
.z0{fill:var(--oksoft)}.z1{fill:var(--warnsoft)}.z2{fill:var(--errsoft)}.mk{fill:var(--ink)}.zt{font-size:12px;font-weight:600}.zt0{fill:var(--key)}.zt1{fill:var(--warn)}.zt2{fill:var(--err)}
.c{fill:var(--bg);stroke:var(--line)}.n{fill:var(--ink);font-size:26px;font-weight:700}.nk{fill:var(--key)}.ct{fill:var(--ink);font-size:13px;font-weight:600}.cs{fill:var(--muted);font-size:12px}.ar{stroke:var(--muted);stroke-width:1.5}.ah{fill:var(--muted)}.sec{fill:var(--muted);font-size:12px;font-weight:600;letter-spacing:.06em}
</style>
<rect class="bg" x="0.5" y="0.5" width="859" height="199" rx="16"/>
<text class="t" x="24" y="38">The feedback loop on one payer</text>
<text class="st" x="24" y="60">Northwind Health Plan, prior authorization denials. Days 1 to 3 teach; days 4 to 7 test.</text>
<rect class="c" x="24.0" y="80" width="244.0" height="96" rx="12"/><text class="n" x="42.0" y="118">1 of 7</text><text class="ct" x="42.0" y="142">appeals won, days 1 to 3</text><text class="cs" x="42.0" y="160">The system expected 3.82 wins</text>
<rect class="c" x="308.0" y="80" width="244.0" height="96" rx="12"/><text class="n" x="326.0" y="118">× 0.53</text><text class="ct" x="326.0" y="142">new win odds for this payer</text><text class="cs" x="326.0" y="160">and reason; 4 outcomes needed</text>
<line class="ar" x1="274.0" y1="128" x2="298.0" y2="128"/><path class="ah" d="M298.0,123 L305.0,128 L298.0,133 z"/>
<rect class="c" x="592.0" y="80" width="244.0" height="96" rx="12"/><text class="n nk" x="610.0" y="118">211 to 147</text><text class="ct" x="610.0" y="142">USD lost, all payers, days 4 to 7</text><text class="cs" x="610.0" y="160">1 appeal now written off instead</text>
<line class="ar" x1="558.0" y1="128" x2="582.0" y2="128"/><path class="ah" d="M582.0,123 L589.0,128 L582.0,133 z"/>
</svg>