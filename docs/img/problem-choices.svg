<svg xmlns="http://www.w3.org/2000/svg" width="860" height="200" viewBox="0 0 860 200" role="img" aria-label="Three choices for each denial. Fix and resend, about 25 USD, right when the error is the provider's; if wrong, the payer denies it again. Appeal with a letter, 57 to 108 USD, right when the payer is wrong and the records prove it; if wrong, the appeal cost is lost. Write it off, 0 USD, right when nothing more can be recovered; if wrong, the whole payment is lost." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
svg{--bg:#FFFFFF;--line:#E3E0F5;--ink:#1F1D2B;--muted:#5E5A72;--pri:#6941E6;--soft:#EDE8FF;--err:#C23434;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){svg{--bg:#1C1A28;--line:#2E2B40;--ink:#EDEBF7;--muted:#A9A5BE;--pri:#A48BFF;--soft:#2A2250;--err:#F07878}}
.c{fill:var(--bg);stroke:var(--line)}.tag{fill:var(--soft)}.tt{fill:var(--pri);font-size:13px;font-weight:600}
.h{fill:var(--ink);font-size:20px;font-weight:600}.p{fill:var(--muted);font-size:14px}.w{fill:var(--err);font-size:14px;font-weight:600}
</style>
<rect class="c" x="0.5" y="0.5" width="275.0" height="199" rx="12"/>
<text class="h" x="24.0" y="44">Fix and resend</text>
<rect class="tag" x="24.0" y="60" width="105" height="26" rx="6"/><text class="tt" x="32.0" y="78">about 25 USD</text>
<text class="p" x="24.0" y="118">Right when the error is ours:</text><text class="p" x="24.0" y="138">a wrong code or a missing field.</text>
<text class="w" x="24.0" y="174">If wrong: the payer denies it again.</text>
<rect class="c" x="292.5" y="0.5" width="275.0" height="199" rx="12"/>
<text class="h" x="316.0" y="44">Appeal with a letter</text>
<rect class="tag" x="316.0" y="60" width="112" height="26" rx="6"/><text class="tt" x="324.0" y="78">57 to 108 USD</text>
<text class="p" x="316.0" y="118">Right when the payer is wrong</text><text class="p" x="316.0" y="138">and the records prove it.</text>
<text class="w" x="316.0" y="174">If wrong: the appeal cost is lost.</text>
<rect class="c" x="584.5" y="0.5" width="275.0" height="199" rx="12"/>
<text class="h" x="608.0" y="44">Write it off</text>
<rect class="tag" x="608.0" y="60" width="53" height="26" rx="6"/><text class="tt" x="616.0" y="78">0 USD</text>
<text class="p" x="608.0" y="118">Right when nothing more</text><text class="p" x="608.0" y="138">can be recovered.</text>
<text class="w" x="608.0" y="174">If wrong: the whole payment is lost.</text>
</svg>