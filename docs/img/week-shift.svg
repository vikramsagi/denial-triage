<text class="zt zt0" x="36.0" y="443">Stable, under 0.10</text><text class="zt zt1" x="270.0" y="443">Warning, 0.10 to 0.25</text><text class="zt zt2" x="616.0" y="443">Alert, over 0.25</text>
