<svg xmlns="http://www.w3.org/2000/svg" width="860" height="514" viewBox="0 0 860 514" role="img" aria-label="Share of denials by reason, before launch versus the test week. Prior authorization rose from 12.5% to 31.3%; every other reason fell a little. The monitor measured the shift at 0.226 on a scale where 0.10 warns and 0.25 alerts, so it raised a warning." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
svg{--bg:#FFFFFF;--line:#E3E0F5;--ink:#1F1D2B;--muted:#5E5A72;--a:#8C8899;--b:#6941E6;--warn:#A35F00;--warnsoft:#FBF0DF;--err:#C23434;--errsoft:#FBE7E7;--oksoft:#E2F3EA;--key:#0F8F7A;--soft:#EDE8FF;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){svg{--bg:#1C1A28;--line:#2E2B40;--ink:#EDEBF7;--muted:#A9A5BE;--a:#6E6A80;--b:#A48BFF;--warn:#E8A23A;--warnsoft:#3A2E1A;--err:#F07878;--errsoft:#3A1F24;--oksoft:#1B3328;--key:#3CCFB5;--soft:#2A2250}}
.bg{fill:var(--bg);stroke:var(--line)}.t{fill:var(--ink);font-size:18px;font-weight:600}.st{fill:var(--muted);font-size:13px}
.l{fill:var(--muted);font-size:13px}.lk{fill:var(--ink);font-size:13px;font-weight:600}.v{fill:var(--ink);font-size:12px;font-variant-numeric:tabular-nums}.vk{fill:var(--ink);font-size:12px;font-weight:700}
.sa{fill:var(--a)}.sb{fill:var(--b)}.g{stroke:var(--line)}.r{fill:var(--muted);font-size:12px}.leg{fill:var(--ink);font-size:12px}
.z0{fill:var(--oksoft)}.z1{fill:var(--warnsoft)}.z2{fill:var(--errsoft)}.mk{fill:var(--ink)}.zt{font-size:12px;font-weight:600}.zt0{fill:var(--key)}.zt1{fill:var(--warn)}.zt2{fill:var(--err)}
.c{fill:var(--bg);stroke:var(--line)}.n{fill:var(--ink);font-size:26px;font-weight:700}.nk{fill:var(--key)}.ct{fill:var(--ink);font-size:13px;font-weight:600}.cs{fill:var(--muted);font-size:12px}.ar{stroke:var(--muted);stroke-width:1.5}.ah{fill:var(--muted)}.sec{fill:var(--muted);font-size:12px;font-weight:600;letter-spacing:.06em}
</style>
