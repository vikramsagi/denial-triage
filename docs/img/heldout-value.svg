<svg xmlns="http://www.w3.org/2000/svg" width="860" height="310" viewBox="0 0 860 310" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Share of recoverable dollars captured, 100 held-out denials</title>
<desc id="d">My system 99.1% (95% interval 97.2 to 99.9). Rules and expected value without AI 82.5% (71.8 to 90.7). Reason-code lookup 66.5% (50.2 to 81.2). Appeal every claim above 500 USD 49.1% (36.3 to 62.3).</desc>
<style>
svg{--bg:#FFFFFF;--line:#E3E0F5;--ink:#1F1D2B;--muted:#5E5A72;--bar:#6941E6;--key:#0F8F7A;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){svg{--bg:#1C1A28;--line:#2E2B40;--ink:#EDEBF7;--muted:#A9A5BE;--bar:#A48BFF;--key:#3CCFB5}}
.bg{fill:var(--bg);stroke:var(--line)}.t{fill:var(--ink);font-size:20px;font-weight:600}.st{fill:var(--muted);font-size:14px}
.l{fill:var(--muted);font-size:14px}.lk{fill:var(--ink);font-size:14px;font-weight:600}
.v{fill:var(--ink);font-size:14px;font-variant-numeric:tabular-nums}.vk{fill:var(--ink);font-size:14px;font-weight:700}
.r{fill:var(--muted);font-size:12px;font-weight:500}.g{stroke:var(--line);stroke-width:1}.tk{fill:var(--muted);font-size:12px;font-weight:500}
.b{fill:var(--bar)}.bk{fill:var(--key)}.w{stroke:var(--ink);stroke-width:1.5;stroke-linecap:round}
</style>
