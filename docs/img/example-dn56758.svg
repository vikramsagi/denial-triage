<svg xmlns="http://www.w3.org/2000/svg" width="860" height="676" viewBox="0 0 860 676" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">One denial end to end: DN-56758</title><desc id="d">A cardiology claim for 4,680.19 USD denied as not medically necessary. No rule applies. Both AI reads find a medical necessity denial with evidence in record lines D3 and D5. Win odds 70 percent. Appeal is worth 3,170 USD after cost, fix minus 25, write off 0. The letter passed the citation check on the first try and the judge gave 5 out of 5 on all four scores. Each letter sentence cites the record line that supports it; the billing hold and address lines are not used.</desc>
<style>
svg{--bg:#FFFFFF;--line:#E3E0F5;--ink:#1F1D2B;--muted:#5E5A72;--pri:#6941E6;--soft:#EDE8FF;--key:#0F8F7A;--keysoft:#E3F4F0;--err:#C23434;--mutsoft:#EFEEF3;--arrow:#8C8899;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){svg{--bg:#1C1A28;--line:#2E2B40;--ink:#EDEBF7;--muted:#A9A5BE;--pri:#A48BFF;--soft:#2A2250;--key:#3CCFB5;--keysoft:#173A35;--err:#F07878;--mutsoft:#2A2838;--arrow:#6E6A80}}
.card{fill:var(--bg);stroke:var(--line)}.box{fill:var(--bg);stroke:var(--line)}.cited{fill:var(--bg);stroke:var(--pri);stroke-width:1.5}.unused{fill:var(--mutsoft);stroke:none}
.sec{fill:var(--muted);font-size:12px;font-weight:600;letter-spacing:.06em}.n{fill:var(--soft)}.nt{fill:var(--pri);font-size:12px;font-weight:600}
.t{fill:var(--ink);font-size:14px;font-weight:600}.s{fill:var(--muted);font-size:12px}.b{fill:var(--ink);font-size:13px}.bm{fill:var(--muted);font-size:13px}
.id{fill:var(--pri);font-size:12px;font-weight:600;font-family:"JetBrains Mono",ui-monospace,monospace}.idm{fill:var(--muted);font-size:12px;font-weight:600;font-family:"JetBrains Mono",ui-monospace,monospace}
.lnk{stroke:var(--pri);stroke-width:1.5;fill:none;opacity:.55}.bar{fill:var(--key)}.barn{fill:var(--err)}.base{stroke:var(--line)}.v{fill:var(--ink);font-size:12px;font-weight:600}
.ok{fill:var(--key);font-size:13px;font-weight:600}.hd{fill:var(--ink);font-size:18px;font-weight:600}
</style>
<rect class="card" x="0.5" y="0.5" width="859" height="675" rx="16"/>
<text class="hd" x="24" y="40">DN-56758: a heart catheterization denied as not medically necessary</text>
<text class="s" x="24" y="62">Bluewater Mutual Insurance · reason code CO-50 · 4,680.19 USD allowed · development set</text>
<rect class="box" x="24.0" y="84" width="152.8" height="128" rx="12"/>
<text class="t" x="38.0" y="112">Rules</text>
<text class="s" x="38.0" y="140">No rule applies,</text><text class="s" x="38.0" y="156">so the AI reads it.</text>
<text class="v" x="38.0" y="198">Cost: 0 USD</text>
<rect class="box" x="188.8" y="84" width="152.8" height="128" rx="12"/>
<text class="t" x="202.8" y="112">Two reads</text>
<text class="s" x="202.8" y="140">Both say medical</text><text class="s" x="202.8" y="156">necessity, D3 and D5.</text>
<text class="v" x="202.8" y="198">Cost: 0.016 USD</text>
<rect class="box" x="353.6" y="84" width="152.8" height="128" rx="12"/>
<text class="t" x="367.6" y="112">Win odds</text>
<text class="s" x="367.6" y="140">70%, from past</text><text class="s" x="367.6" y="156">outcomes like this.</text>
<text class="v" x="367.6" y="198">Answer key: 77%</text>
<rect class="box" x="518.4" y="84" width="152.8" height="128" rx="12"/>
<text class="t" x="532.4" y="112">Dollars</text>
<text class="s" x="532.4" y="144">Appeal</text>
<rect class="bar" x="584.4" y="134" width="32.8" height="12" rx="3"/>
<text class="v" x="657.2" y="144" text-anchor="end">3,170</text>
<text class="s" x="532.4" y="168">Fix</text>
<rect class="barn" x="580.4" y="158" width="4" height="12" rx="1"/>
<text class="v" x="657.2" y="168" text-anchor="end">-25</text>
<text class="s" x="532.4" y="192">Write off</text>
<line class="base" x1="584.4" y1="182" x2="584.4" y2="194"/>
<text class="v" x="657.2" y="192" text-anchor="end">0</text>
<rect class="box" x="683.2" y="84" width="152.8" height="128" rx="12"/>
<text class="t" x="697.2" y="112">Letter</text>
<text class="s" x="697.2" y="140">Checks passed on</text><text class="s" x="697.2" y="156">the first try.</text>
<text class="v" x="697.2" y="198">Judge: 5 of 5 on all 4</text>
<text class="sec" x="24" y="244">WHAT THE RECORD SAYS</text><text class="sec" x="450.0" y="244">WHAT THE LETTER CLAIMS</text>
<rect class="unused" x="24" y="256" width="378.0" height="50" rx="10"/>
<text class="idm" x="36" y="276">D1</text><text class="s" x="64" y="276">Billing note · not needed</text>
<text class="bm" x="36" y="296">Account placed on hold pending denial review.</text>
<rect class="cited" x="24" y="316" width="378.0" height="66" rx="10"/>
<text class="id" x="36" y="336">D2</text><text class="s" x="64" y="336">Clinical note</text>
<text class="b" x="36" y="356">Objective findings on 2026-03-18 support I25.10,</text>
<text class="b" x="36" y="372">with worsening function documented.</text>
<rect class="cited" x="24" y="392" width="378.0" height="66" rx="10"/>
<text class="id" x="36" y="412">D3</text><text class="s" x="64" y="412">Payer policy</text>
<text class="b" x="36" y="432">Coverage criteria for 93458: minimum 6 weeks of</text>
<text class="b" x="36" y="448">conservative therapy before approval.</text>
<rect class="unused" x="24" y="468" width="378.0" height="50" rx="10"/>
<text class="idm" x="36" y="488">D4</text><text class="s" x="64" y="488">Front desk · not needed</text>
<text class="bm" x="36" y="508">Mailing address verified at check-in.</text>
<rect class="cited" x="24" y="528" width="378.0" height="98" rx="10"/>
<text class="id" x="36" y="548">D5</text><text class="s" x="64" y="548">Clinical note</text>
<text class="b" x="36" y="568">Provider records 6 weeks of unsuccessful</text>
<text class="b" x="36" y="584">conservative care leading to the left heart</text>
<text class="b" x="36" y="600">catheterization with coronary angiography on</text>
<text class="b" x="36" y="616">2026-03-18.</text>
<rect class="box" x="450.0" y="256" width="378.0" height="78" rx="10"/>
<text class="id" x="462.0" y="276">cites D3</text>
<text class="b" x="462.0" y="296">The payer's coverage criteria for 93458 require a</text>
<text class="b" x="462.0" y="312">minimum of 6 weeks of conservative therapy before</text>
<text class="b" x="462.0" y="328">approval.</text>
<rect class="box" x="450.0" y="344" width="378.0" height="78" rx="10"/>
<text class="id" x="462.0" y="364">cites D5</text>
<text class="b" x="462.0" y="384">The provider records 6 weeks of unsuccessful</text>
<text class="b" x="462.0" y="400">conservative care leading to the left heart</text>
<text class="b" x="462.0" y="416">catheterization on 2026-03-18.</text>
<rect class="box" x="450.0" y="432" width="378.0" height="62" rx="10"/>
<text class="id" x="462.0" y="452">cites D3 and D5</text>
<text class="b" x="462.0" y="472">The documented conservative care matches the minimum</text>
<text class="b" x="462.0" y="488">stated in the payer's policy.</text>
<rect class="box" x="450.0" y="504" width="378.0" height="78" rx="10"/>
<text class="id" x="462.0" y="524">cites D2</text>
<text class="b" x="462.0" y="544">The clinical note records objective findings on</text>
<text class="b" x="462.0" y="560">2026-03-18 that support I25.10, with worsening</text>
<text class="b" x="462.0" y="576">function documented.</text>
