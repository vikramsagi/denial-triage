<svg xmlns="http://www.w3.org/2000/svg" width="860" height="590" viewBox="0 0 860 590" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">How a denial moves through the system</title>
<desc id="d">Step 1, simple rules settle what they can for free. Step 2, Claude Haiku 4.5 reads the record twice. Step 3, win odds come from past outcomes and the evidence. Step 4, each action is compared in dollars. Step 5, the system takes the best-value action or hands the claim to a person. Appeals get a letter from Claude Sonnet 5.5, a code check that every fact matches its cited source, and a review by Claude Opus 5.5. Every step logs a decision event; monitoring flags drift and appeal outcomes correct the win odds.</desc>
<style>
svg{--bg:#FFFFFF;--line:#E3E0F5;--ink:#1F1D2B;--muted:#5E5A72;--pri:#6941E6;--soft:#EDE8FF;--key:#0F8F7A;--warn:#A35F00;--warnsoft:#FBF0DF;--mutsoft:#EFEEF3;--arrow:#8C8899;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){svg{--bg:#1C1A28;--line:#2E2B40;--ink:#EDEBF7;--muted:#A9A5BE;--pri:#A48BFF;--soft:#2A2250;--key:#3CCFB5;--warn:#E8A23A;--warnsoft:#3A2E1A;--mutsoft:#2A2838;--arrow:#6E6A80}}
.card{fill:var(--bg);stroke:var(--line)}.box{fill:var(--bg);stroke:var(--line)}.boxp{fill:var(--soft);stroke:none}
.n{fill:var(--soft)}.nt{fill:var(--pri);font-size:12px;font-weight:600}.t{fill:var(--ink);font-size:14px;font-weight:600}.s{fill:var(--muted);font-size:12px}
.sec{fill:var(--muted);font-size:12px;font-weight:600;letter-spacing:.06em}.a{stroke:var(--arrow);stroke-width:1.5;fill:none}.ah{fill:var(--arrow)}
.pp{fill:var(--soft)}.ppt{fill:var(--pri)}.pw{fill:var(--warnsoft)}.pwt{fill:var(--warn)}.pm{fill:var(--mutsoft)}.pmt{fill:var(--muted)}.pk{fill:none;stroke:var(--key);stroke-width:1.5}.pkt{fill:var(--key)}
.pt{font-size:13px;font-weight:600}.fb{fill:var(--soft)}.fbt{fill:var(--ink);font-size:13px}.fbb{fill:var(--pri);font-size:13px;font-weight:600}
</style>
<defs><marker id="m" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path class="ah" d="M0,0 L8,4 L0,8 z"/></marker></defs>
<rect class="card" x="0.5" y="0.5" width="859" height="589" rx="16"/>
<text class="sec" x="24" y="36">EVERY DENIAL</text>
<rect class="box" x="24" y="50" width="148" height="96" rx="12"/>
<circle class="n" cx="48" cy="74" r="11"/><text class="nt" x="48" y="78" text-anchor="middle">1</text>
<text class="t" x="38" y="106">Rules first</text><text class="s" x="38" y="124">A typo or missing</text><text class="s" x="38" y="139">number needs no AI</text>
<rect class="box" x="190" y="50" width="148" height="96" rx="12"/>
<circle class="n" cx="214" cy="74" r="11"/><text class="nt" x="214" y="78" text-anchor="middle">2</text>
<text class="t" x="204" y="106">AI reads twice</text><text class="s" x="204" y="124">Haiku 4.5 names the</text><text class="s" x="204" y="139">cause, two times</text>
<line class="a" x1="174" y1="98.0" x2="187" y2="98.0" marker-end="url(#m)"/>
<rect class="box" x="356" y="50" width="148" height="96" rx="12"/>
<circle class="n" cx="380" cy="74" r="11"/><text class="nt" x="380" y="78" text-anchor="middle">3</text>
<text class="t" x="370" y="106">Win odds</text><text class="s" x="370" y="124">From past outcomes</text><text class="s" x="370" y="139">and the evidence</text>
<line class="a" x1="340" y1="98.0" x2="353" y2="98.0" marker-end="url(#m)"/>
<rect class="box" x="522" y="50" width="148" height="96" rx="12"/>
<circle class="n" cx="546" cy="74" r="11"/><text class="nt" x="546" y="78" text-anchor="middle">4</text>
<text class="t" x="536" y="106">Compare in dollars</text><text class="s" x="536" y="124">Odds × amount,</text><text class="s" x="536" y="139">minus each cost</text>
<line class="a" x1="506" y1="98.0" x2="519" y2="98.0" marker-end="url(#m)"/>
<rect class="box" x="688" y="50" width="148" height="96" rx="12"/>
<circle class="n" cx="712" cy="74" r="11"/><text class="nt" x="712" y="78" text-anchor="middle">5</text>
<text class="t" x="702" y="106">Decide</text><text class="s" x="702" y="124">Best value, or</text><text class="s" x="702" y="139">hand to a person</text>
<line class="a" x1="672" y1="98.0" x2="685" y2="98.0" marker-end="url(#m)"/>
<path class="a" d="M762.0,146 V204 H118.75 V222" marker-end="url(#m)"/>
<path class="a" d="M326.25,204 V222" marker-end="url(#m)"/>
<path class="a" d="M533.75,204 V222" marker-end="url(#m)"/>
<path class="a" d="M741.25,204 V222" marker-end="url(#m)"/>
<text class="sec" x="24" y="172">ONE OF FOUR ACTIONS</text>
<rect class="box" x="24.0" y="226" width="189.5" height="78" rx="12"/>
<rect class="pp" x="38.0" y="238" width="64" height="24" rx="12"/><text class="pt ppt" x="48.0" y="255">Appeal</text>
<text class="s" x="38.0" y="278">Letter, then checks below</text>
<rect class="box" x="231.5" y="226" width="189.5" height="78" rx="12"/>
<rect class="pp" x="245.5" y="238" width="122" height="24" rx="12"/><text class="pt ppt" x="255.5" y="255">Fix and resend</text>
<text class="s" x="245.5" y="278">Names what to fix</text>
<rect class="box" x="439.0" y="226" width="189.5" height="78" rx="12"/>
<rect class="pm" x="453.0" y="238" width="86" height="24" rx="12"/><text class="pt pmt" x="463.0" y="255">Write off</text>
<text class="s" x="453.0" y="278">Says why nothing is left</text>
<rect class="box" x="646.5" y="226" width="189.5" height="78" rx="12"/>
<rect class="pw" x="660.5" y="238" width="122" height="24" rx="12"/><text class="pt pwt" x="670.5" y="255">Needs a person</text>
<text class="s" x="660.5" y="278">5,000 USD or more, or the</text>
<text class="s" x="660.5" y="292">two reads disagree</text>
<text class="sec" x="130.75" y="348">APPEALS ONLY</text>
<path class="a" d="M54,296 V394 H64" marker-end="url(#m)" style="display:none"/>
<rect class="box" x="24.0" y="364" width="189.5" height="84" rx="12"/>
<text class="t" x="38.0" y="392">Write the letter</text><text class="s" x="38.0" y="414">Sonnet 5.5 cites a</text><text class="s" x="38.0" y="430">record line per fact</text>
<rect class="box" x="231.5" y="364" width="189.5" height="84" rx="12"/>
<text class="t" x="245.5" y="392">Check citations</text><text class="s" x="245.5" y="414">Code confirms every date,</text><text class="s" x="245.5" y="430">amount and code</text>
<line class="a" x1="215.5" y1="406" x2="228.5" y2="406" marker-end="url(#m)"/>
<rect class="box" x="439.0" y="364" width="189.5" height="84" rx="12"/>
<text class="t" x="453.0" y="392">Review the letter</text><text class="s" x="453.0" y="414">Opus 5.5 grades it;</text><text class="s" x="453.0" y="430">ship only if faithful</text>
<line class="a" x1="423.0" y1="406" x2="436.0" y2="406" marker-end="url(#m)"/>
<rect class="box" x="646.5" y="364" width="189.5" height="84" rx="12"/>
<text class="t" x="660.5" y="392" style="fill:var(--key)">Ready for approval</text><text class="s" x="660.5" y="414">With numbered</text><text class="s" x="660.5" y="430">enclosures</text>
<line class="a" x1="630.5" y1="406" x2="643.5" y2="406" marker-end="url(#m)"/>
<path class="a" d="M118.75,304 V360" marker-end="url(#m)"/>
<rect class="fb" x="24" y="484" width="812" height="80" rx="12"/>
<text class="fbb" x="44" y="514">After launch</text>
<text class="fbt" x="44" y="538">Every step logs a decision event. A monitor flags drift without needing right answers,</text>
<text class="fbt" x="44" y="556">and appeal outcomes that come back correct the win odds in step 3.</text>
</svg>