<svg xmlns="http://www.w3.org/2000/svg" width="860" height="458" viewBox="0 0 860 458" role="img" aria-label="Held-out scorecard. Value captured 99.1%, met. Root cause correct 94.0%, met. Appeal precision 96.8%, met. Appeal recall 93.8%, not met with confidence. Prompt injection success 0 of 6, met. Letters pass the citation check 31 of 31, met. API cost per denial 0.0182 USD, met." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
svg{--bg:#FFFFFF;--line:#E3E0F5;--ink:#1F1D2B;--muted:#5E5A72;--ok:#1E7F52;--oksoft:#E2F3EA;--warn:#A35F00;--warnsoft:#FBF0DF;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){svg{--bg:#1C1A28;--line:#2E2B40;--ink:#EDEBF7;--muted:#A9A5BE;--ok:#4CC38A;--oksoft:#1B3328;--warn:#E8A23A;--warnsoft:#3A2E1A}}
.bg{fill:var(--bg);stroke:var(--line)}.t{fill:var(--ink);font-size:18px;font-weight:600}.st{fill:var(--muted);font-size:13px}
.h{fill:var(--muted);font-size:12px;font-weight:600;letter-spacing:.04em}.m{fill:var(--ink);font-size:14px;font-weight:600}.g{fill:var(--muted);font-size:13px}
.v{fill:var(--ink);font-size:15px;font-weight:700}.r{fill:var(--muted);font-size:12px}.rule{stroke:var(--line)}
.p-met{fill:var(--oksoft)}.t-met{fill:var(--ok)}.p-no{fill:var(--warnsoft)}.t-no{fill:var(--warn)}.pt{font-size:12px;font-weight:600}
</style>
<rect class="bg" x="0.5" y="0.5" width="859" height="457" rx="16"/>
<text class="t" x="24" y="38">Held-out scorecard</text>
<text class="st" x="24" y="60">Targets were set before the test. A target counts only if the low end of its 95% interval clears it.</text>
<text class="h" x="24" y="82">MEASURE</text><text class="h" x="250" y="82">TARGET</text><text class="h" x="410" y="82">RESULT</text><text class="h" x="836" y="82" text-anchor="end">STATUS</text>
<line class="rule" x1="24" y1="96" x2="836" y2="96"/>
<text class="m" x="24" y="124">Value captured</text><text class="g" x="250" y="124">Beat every baseline</text>
<text class="v" x="410" y="124">99.1%</text><text class="r" x="530" y="124">97.2 to 99.9; best baseline 82.5%</text>
<rect class="p-met" x="762" y="107" width="74" height="24" rx="12"/><text class="pt t-met" x="799.0" y="124" text-anchor="middle">✓ Met</text>
<line class="rule" x1="24" y1="142" x2="836" y2="142"/>
<text class="m" x="24" y="170">Root cause correct</text><text class="g" x="250" y="170">85% or better</text>
<text class="v" x="410" y="170">94.0%</text><text class="r" x="530" y="170">89.0 to 98.0</text>
<rect class="p-met" x="762" y="153" width="74" height="24" rx="12"/><text class="pt t-met" x="799.0" y="170" text-anchor="middle">✓ Met</text>
<line class="rule" x1="24" y1="188" x2="836" y2="188"/>
<text class="m" x="24" y="216">Appeal precision</text><text class="g" x="250" y="216">75% or better</text>
<text class="v" x="410" y="216">96.8%</text><text class="r" x="530" y="216">89.3 to 100</text>
<rect class="p-met" x="762" y="199" width="74" height="24" rx="12"/><text class="pt t-met" x="799.0" y="216" text-anchor="middle">✓ Met</text>
<line class="rule" x1="24" y1="234" x2="836" y2="234"/>
<text class="m" x="24" y="262">Appeal recall</text><text class="g" x="250" y="262">90% or better</text>
<text class="v" x="410" y="262">93.8%</text><text class="r" x="530" y="262">83.9 to 100; low end misses the target</text>
<rect class="p-no" x="750" y="245" width="86" height="24" rx="12"/><text class="pt t-no" x="793.0" y="262" text-anchor="middle">! Not yet</text>
<line class="rule" x1="24" y1="280" x2="836" y2="280"/>
<text class="m" x="24" y="308">Prompt injection success</text><text class="g" x="250" y="308">0%</text>
<text class="v" x="410" y="308">0 of 6</text><text class="r" x="530" y="308">met, but 6 records is a small test</text>
<rect class="p-met" x="762" y="291" width="74" height="24" rx="12"/><text class="pt t-met" x="799.0" y="308" text-anchor="middle">✓ Met</text>
<line class="rule" x1="24" y1="326" x2="836" y2="326"/>
<text class="m" x="24" y="354">Letters pass the citation check</text><text class="g" x="250" y="354">100%</text>
<text class="v" x="410" y="354">31 of 31</text><text class="r" x="530" y="354">every shipped letter</text>
<rect class="p-met" x="762" y="337" width="74" height="24" rx="12"/><text class="pt t-met" x="799.0" y="354" text-anchor="middle">✓ Met</text>
<line class="rule" x1="24" y1="372" x2="836" y2="372"/>
<text class="m" x="24" y="400">API cost per denial</text><text class="g" x="250" y="400">Under 0.02 USD</text>
<text class="v" x="410" y="400">0.0182 USD</text><text class="r" x="530" y="400">two reads, letter and grading</text>
<rect class="p-met" x="762" y="383" width="74" height="24" rx="12"/><text class="pt t-met" x="799.0" y="400" text-anchor="middle">✓ Met</text>
<line class="rule" x1="24" y1="418" x2="836" y2="418"/>
<text class="r" x="24" y="442">Source: held-out run in evals/runs. 100 denials, 32 of them worth appealing.</text></svg>