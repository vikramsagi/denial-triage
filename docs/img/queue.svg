<svg xmlns="http://www.w3.org/2000/svg" width="860" height="392" viewBox="0 0 860 392" role="img" aria-label="Denial queue with a recommendation on every row. DN-56758, 4,680 USD: appeal, policy asks for 6 weeks of conservative care and the chart shows 6 weeks, win odds 70%, worth 3,170 USD. DN-77049, 4,015 USD: fix and resend, the authorization number is on file but missing from the claim, worth 3,789 USD. DN-31039, 1,722 USD: write off, sent after the 90-day filing window. DN-28780, 6,511 USD: needs a person, above 5,000 USD, suggests an appeal at 63% win odds." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
svg{--bg:#FFFFFF;--page:#F7F6FF;--line:#E3E0F5;--ink:#1F1D2B;--muted:#5E5A72;--pri:#6941E6;--soft:#EDE8FF;--warn:#A35F00;--warnsoft:#FBF0DF;--mutsoft:#EFEEF3;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){svg{--bg:#1C1A28;--page:#12111A;--line:#2E2B40;--ink:#EDEBF7;--muted:#A9A5BE;--pri:#A48BFF;--soft:#2A2250;--warn:#E8A23A;--warnsoft:#3A2E1A;--mutsoft:#2A2838}}
.card{fill:var(--bg);stroke:var(--line)}.h{fill:var(--ink);font-size:18px;font-weight:600}.hm{fill:var(--muted);font-size:13px}
.id{fill:var(--ink);font-size:14px;font-weight:600}.m{fill:var(--muted);font-size:13px}.r{fill:var(--ink);font-size:14px}
.sep{stroke:var(--line)}.amt{fill:var(--ink);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.p-pri{fill:var(--soft)}.t-pri{fill:var(--pri)}.p-mut{fill:var(--mutsoft)}.t-mut{fill:var(--muted)}.p-warn{fill:var(--warnsoft)}.t-warn{fill:var(--warn)}
.pt{font-size:13px;font-weight:600}
</style>
<rect class="card" x="0.5" y="0.5" width="859" height="391" rx="16"/>
<text class="h" x="24" y="38">Denial queue</text><text class="hm" x="24" y="58">Every row arrives with a recommendation and the reason behind it. A person approves each one.</text>
<line class="sep" x1="24" y1="72" x2="836" y2="72"/>
<text class="id" x="24" y="102">DN-56758</text><text class="m" x="24" y="124">Bluewater Mutual</text>
<text class="amt" x="230" y="102" text-anchor="end">4,680 USD</text>
<rect class="p-pri" x="256" y="86" width="64" height="24" rx="12"/><text class="pt t-pri" x="266" y="103">Appeal</text>
<text class="r" x="256" y="132">Policy asks for 6 weeks of conservative care. The chart shows 6 weeks.</text>
<text class="m" x="836" y="103" text-anchor="end">Win odds 70%. Worth 3,170 USD</text>
<line class="sep" x1="24" y1="148" x2="836" y2="148"/>
<text class="id" x="24" y="178">DN-77049</text><text class="m" x="24" y="200">Lakeshore Medicaid</text>
<text class="amt" x="230" y="178" text-anchor="end">4,015 USD</text>
<rect class="p-pri" x="256" y="162" width="122" height="24" rx="12"/><text class="pt t-pri" x="266" y="179">Fix and resend</text>
<text class="r" x="256" y="208">The authorization number is on file but missing from the claim.</text>
<text class="m" x="836" y="179" text-anchor="end">Worth 3,789 USD</text>
<line class="sep" x1="24" y1="224" x2="836" y2="224"/>
<text class="id" x="24" y="254">DN-31039</text><text class="m" x="24" y="276">Bluewater Mutual</text>
<text class="amt" x="230" y="254" text-anchor="end">1,722 USD</text>
<rect class="p-mut" x="256" y="238" width="86" height="24" rx="12"/><text class="pt t-mut" x="266" y="255">Write off</text>
<text class="r" x="256" y="284">Sent after the payer's 90-day filing window.</text>
<text class="m" x="836" y="255" text-anchor="end">Nothing to recover</text>
<line class="sep" x1="24" y1="300" x2="836" y2="300"/>
<text class="id" x="24" y="330">DN-28780</text><text class="m" x="24" y="352">Summit Care Advantage</text>
<text class="amt" x="230" y="330" text-anchor="end">6,511 USD</text>
<rect class="p-warn" x="256" y="314" width="122" height="24" rx="12"/><text class="pt t-warn" x="266" y="331">Needs a person</text>
<text class="r" x="256" y="360">Above 5,000 USD. Suggests an appeal at 63% win odds.</text>
<text class="m" x="836" y="331" text-anchor="end">A person decides</text>
</svg>