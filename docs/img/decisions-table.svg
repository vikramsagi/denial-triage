<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1098" viewBox="0 0 1000 1098" role="img" aria-label="Six decisions with what was rejected, what settled it, and what each gains and gives up in architecture and business. In focus: a small model with thinking reads every denial; ask twice and send disagreements to a person." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
svg{--bg:#FFFFFF;--line:#E3E0F5;--ink:#1F1D2B;--muted:#5E5A72;--pri:#6941E6;--soft:#EDE8FF;--on:#FFFFFF;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){svg{--bg:#1C1A28;--line:#2E2B40;--ink:#EDEBF7;--muted:#A9A5BE;--pri:#A48BFF;--soft:#2A2250;--on:#12111A}}
.bg{fill:var(--bg);stroke:var(--line)}.hl{fill:var(--soft)}.rule{stroke:var(--line)}
.h{fill:var(--muted);font-size:12px;font-weight:600;letter-spacing:.04em}
.c{fill:var(--ink);font-size:13px}.k{fill:var(--ink);font-size:13px;font-weight:600}
.kp{fill:var(--pri);font-size:13px;font-weight:600}.kn{fill:var(--pri);font-size:14px;font-weight:700}.n{fill:var(--ink);font-size:14px;font-weight:600}
.pill{fill:var(--pri)}.pt{fill:var(--on);font-size:11px;font-weight:600;letter-spacing:.03em}
</style>
<rect class="bg" x="0.5" y="0.5" width="999" height="1097" rx="16"/>
<text class="h" x="32" y="42">DECISION</text>
<text class="h" x="202" y="42">WHAT I REJECTED</text>
<text class="h" x="332" y="42">WHAT SETTLED IT</text>
<text class="h" x="532" y="42">WHAT I GAIN</text>
<text class="h" x="762" y="42">WHAT I GIVE UP</text>
<line class="rule" x1="20" y1="58" x2="980" y2="58"/>
<rect class="hl" x="20" y="58" width="960" height="176"/>
<rect class="pill" x="32" y="70" width="70" height="20" rx="10"/><text class="pt" x="67" y="84" text-anchor="middle">IN FOCUS</text>
<text class="kn" x="32" y="110">A small model with</text>
<text class="kn" x="32" y="128">thinking reads every</text>
<text class="kn" x="32" y="146">denial</text>
<text class="c" x="202" y="84">Sonnet 5.5, the</text>
<text class="c" x="202" y="102">larger model</text>
<text class="c" x="332" y="84">On 40 hard denials, Haiku</text>
<text class="c" x="332" y="102">4.5 with thinking lost 173</text>
<text class="c" x="332" y="120">USD. Sonnet named every</text>
<text class="c" x="332" y="138">cause correctly and still lost</text>
<text class="c" x="332" y="156">5,311 USD</text>
<text class="kp" x="532" y="84">Architecture:</text>
<text class="c" x="617.5" y="84">A fast, cheap</text>
<text class="c" x="532.0" y="102">model for a short structured</text>
<text class="c" x="532.0" y="120">answer. The larger model is kept</text>
<text class="c" x="532.0" y="138">for writing letters.</text>
<text class="kp" x="532" y="162">Business:</text>
<text class="c" x="596.4" y="162">The least money lost</text>
<text class="c" x="532.0" y="180">of any model, at 0.0073 USD a</text>
<text class="c" x="532.0" y="198">denial.</text>
<text class="kp" x="762" y="84">Architecture:</text>
<text class="c" x="847.5" y="84">Answers vary</text>
<text class="c" x="762.0" y="102">between runs, so it needs the</text>
<text class="c" x="762.0" y="120">two-read check. Two model tiers</text>
<text class="c" x="762.0" y="138">to maintain and upgrade.</text>
<text class="kp" x="762" y="162">Business:</text>
<text class="c" x="826.4" y="162">About twice the cost</text>
<text class="c" x="762.0" y="180">of plain Haiku for a gain inside</text>
<text class="c" x="762.0" y="198">the margin of error. Sonnet</text>
<text class="c" x="762.0" y="216">names causes slightly better.</text>
<line class="rule" x1="20" y1="234" x2="980" y2="234"/>
<rect class="hl" x="20" y="234" width="960" height="158"/>
<rect class="pill" x="32" y="246" width="70" height="20" rx="10"/><text class="pt" x="67" y="260" text-anchor="middle">IN FOCUS</text>
<text class="kn" x="32" y="286">Ask twice and send</text>
<text class="kn" x="32" y="304">disagreements to a</text>
<text class="kn" x="32" y="322">person</text>
<text class="c" x="202" y="260">Trusting the</text>
<text class="c" x="202" y="278">model&#x27;s</text>
<text class="c" x="202" y="296">confidence</text>
<text class="c" x="202" y="314">score</text>
<text class="c" x="332" y="260">The 6 denials where two</text>
<text class="c" x="332" y="278">reads disagreed held 92%</text>
<text class="c" x="332" y="296">of the money lost.</text>
<text class="c" x="332" y="314">Confidence could not tell</text>
<text class="c" x="332" y="332">them apart</text>
<text class="kp" x="532" y="260">Architecture:</text>
<text class="c" x="617.5" y="260">A mistake signal</text>
<text class="c" x="532.0" y="278">that needs no right answers.</text>
<text class="kp" x="532" y="302">Business:</text>
<text class="c" x="596.4" y="302">About 2,770 USD less</text>
<text class="c" x="532.0" y="320">lost on 200 denials.</text>
<text class="kp" x="762" y="260">Architecture:</text>
<text class="c" x="847.5" y="260">Two calls per</text>
<text class="c" x="762.0" y="278">denial, and blind to mistakes both</text>
<text class="c" x="762.0" y="296">reads share.</text>
<text class="kp" x="762" y="320">Business:</text>
<text class="c" x="826.4" y="320">Classification cost</text>
<text class="c" x="762.0" y="338">doubles. 6 more claims go to a</text>
<text class="c" x="762.0" y="356">person, about 90 USD of review</text>
<text class="c" x="762.0" y="374">time.</text>
<line class="rule" x1="20" y1="392" x2="980" y2="392"/>
<text class="n" x="32" y="418">A stronger model</text>
<text class="n" x="32" y="436">grades every letter</text>
<text class="c" x="202" y="418">Grading a</text>
<text class="c" x="202" y="436">sample, or letting</text>
<text class="c" x="202" y="454">the writer grade</text>
<text class="c" x="202" y="472">itself</text>
<text class="c" x="332" y="418">It failed all 5 planted bad</text>
<text class="c" x="332" y="436">letters, each of which had</text>
<text class="c" x="332" y="454">passed the code check</text>
<text class="k" x="532" y="418">Architecture:</text>
<text class="c" x="617.5" y="418">A quality check</text>
<text class="c" x="532.0" y="436">that code cannot do, run through</text>
<text class="c" x="532.0" y="454">the batch API at half price.</text>
<text class="k" x="532" y="478">Business:</text>
<text class="c" x="596.4" y="478">Bad letters are caught</text>
<text class="c" x="532.0" y="496">before an insurer sees them.</text>
<text class="c" x="532.0" y="514">Reviewers only open letters the</text>
<text class="c" x="532.0" y="532">judge did not clear.</text>
<text class="k" x="762" y="418">Architecture:</text>
<text class="c" x="847.5" y="418">A third model and a</text>
<text class="c" x="762.0" y="436">batch step, so letters can wait</text>
<text class="c" x="762.0" y="454">hours. The judge needs its own</text>
<text class="c" x="762.0" y="472">test set.</text>
<text class="k" x="762" y="496">Business:</text>
<text class="c" x="826.4" y="496">0.015 USD a letter.</text>
<text class="c" x="762.0" y="514">Strict about wording, so some</text>
<text class="c" x="762.0" y="532">good letters go to review. Not yet</text>
<text class="c" x="762.0" y="550">checked against billing</text>
<text class="c" x="762.0" y="568">specialists.</text>
<line class="rule" x1="20" y1="586" x2="980" y2="586"/>
<text class="n" x="32" y="612">Rules read formats,</text>
<text class="n" x="32" y="630">never wording</text>
<text class="c" x="202" y="612">Rules that also</text>
<text class="c" x="202" y="630">match keywords</text>
<text class="c" x="332" y="612">Keyword rules settled 85</text>
<text class="c" x="332" y="630">more denials but got 19</text>
<text class="c" x="332" y="648">wrong, and a rule&#x27;s mistake</text>
<text class="c" x="332" y="666">never reaches the AI</text>
<text class="k" x="532" y="612">Architecture:</text>
<text class="c" x="617.5" y="612">Rules that are free,</text>
<text class="c" x="532.0" y="630">testable and give the same</text>
<text class="c" x="532.0" y="648">answer every time.</text>
<text class="k" x="532" y="672">Business:</text>
<text class="c" x="596.4" y="672">57 denials settled at</text>
<text class="c" x="532.0" y="690">no cost, none of them wrong.</text>
<text class="k" x="762" y="612">Architecture:</text>
<text class="c" x="847.5" y="612">Rules cover fewer</text>
<text class="c" x="762.0" y="630">cases, so more denials go to the</text>
<text class="c" x="762.0" y="648">AI.</text>
<text class="k" x="762" y="672">Business:</text>
<text class="c" x="826.4" y="672">About 0.45 USD more</text>
<text class="c" x="762.0" y="690">AI cost per 200 denials. Rule</text>
<text class="c" x="762.0" y="708">accuracy is not yet proven on</text>
<text class="c" x="762.0" y="726">real claims.</text>
<line class="rule" x1="20" y1="744" x2="980" y2="744"/>
<text class="n" x="32" y="770">Code checks every</text>
<text class="n" x="32" y="788">citation</text>
<text class="c" x="202" y="770">Trusting the</text>
<text class="c" x="202" y="788">writer, or only a</text>
<text class="c" x="202" y="806">second model</text>
<text class="c" x="332" y="770">Same verdict every time at</text>
<text class="c" x="332" y="788">no cost. Sonnet 5.5 letters</text>
<text class="c" x="332" y="806">passed 61 of 61 on the first</text>
<text class="c" x="332" y="824">try</text>
<text class="k" x="532" y="770">Architecture:</text>
<text class="c" x="617.5" y="770">A check with no</text>
<text class="c" x="532.0" y="788">model in it, covered by unit tests.</text>
<text class="k" x="532" y="812">Business:</text>
<text class="c" x="596.4" y="812">No letter states a date,</text>
<text class="c" x="532.0" y="830">amount or code that is not in the</text>
<text class="c" x="532.0" y="848">record.</text>
<text class="k" x="762" y="770">Architecture:</text>
<text class="c" x="847.5" y="770">Letters must follow</text>
<text class="c" x="762.0" y="788">a strict citation format, with one</text>
<text class="c" x="762.0" y="806">retry when they fail.</text>
<text class="k" x="762" y="830">Business:</text>
<text class="c" x="826.4" y="830">It checks facts, not</text>
<text class="c" x="762.0" y="848">whether the argument is good. A</text>
<text class="c" x="762.0" y="866">letter that fails twice costs a 15</text>
<text class="c" x="762.0" y="884">USD review.</text>
<line class="rule" x1="20" y1="902" x2="980" y2="902"/>
<text class="n" x="32" y="928">Monitoring and an</text>
<text class="n" x="32" y="946">outcome feedback</text>
<text class="n" x="32" y="964">loop</text>
<text class="c" x="202" y="928">Accuracy</text>
<text class="c" x="202" y="946">dashboards,</text>
<text class="c" x="202" y="964">which need right</text>
<text class="c" x="202" y="982">answers</text>
<text class="c" x="332" y="928">On a simulated week it</text>
<text class="c" x="332" y="946">flagged a payer&#x27;s change</text>
<text class="c" x="332" y="964">with no right answers</text>
<text class="k" x="532" y="928">Architecture:</text>
<text class="c" x="617.5" y="928">Built from events</text>
<text class="c" x="532.0" y="946">the pipeline already logs, with no</text>
<text class="c" x="532.0" y="964">extra AI calls.</text>
<text class="k" x="532" y="988">Business:</text>
<text class="c" x="596.4" y="988">A payer&#x27;s rule change</text>
<text class="c" x="532.0" y="1006">shows up early, and win odds</text>
<text class="c" x="532.0" y="1024">learn from real outcomes.</text>
<text class="k" x="762" y="928">Architecture:</text>
<text class="c" x="847.5" y="928">Needs an outcome</text>
<text class="c" x="762.0" y="946">feed from the billing system, and</text>
<text class="c" x="762.0" y="964">thresholds to tune.</text>
<text class="k" x="762" y="988">Business:</text>
<text class="c" x="826.4" y="988">Outcomes arrive</text>
<text class="c" x="762.0" y="1006">weeks after an appeal, so</text>
<text class="c" x="762.0" y="1024">corrections lag. Each payer and</text>
<text class="c" x="762.0" y="1042">denial reason needs 4 outcomes</text>
<text class="c" x="762.0" y="1060">before its odds change.</text>
<line class="rule" x1="20" y1="1078" x2="980" y2="1078"/>
</svg>