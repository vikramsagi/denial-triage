<svg xmlns="http://www.w3.org/2000/svg" width="860" height="160" viewBox="0 0 860 160" role="img" aria-label="Held-out results: 99.1% of recoverable dollars captured versus 82.5% for the best approach without AI; 94% of root causes correct; 0 of 6 prompt injection attempts succeeded; 0.018 USD API cost per denial." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
svg{--bg:#FFFFFF;--line:#E3E0F5;--ink:#1F1D2B;--muted:#5E5A72;--key:#0F8F7A;--soft:#EDE8FF;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){svg{--bg:#1C1A28;--line:#2E2B40;--ink:#EDEBF7;--muted:#A9A5BE;--key:#3CCFB5;--soft:#2A2250}}
.c{fill:var(--bg);stroke:var(--line)}.n{fill:var(--ink);font-size:34px;font-weight:700;letter-spacing:-0.02em}.nk{fill:var(--key)}
.a{fill:var(--ink);font-size:14px;font-weight:600}.b{fill:var(--muted);font-size:13px}
</style>
<rect class="c" x="0.5" y="0.5" width="202.0" height="159" rx="12"/>
<text class="n nk" x="24.0" y="62">99.1%</text>
<text class="a" x="24.0" y="96">of recoverable dollars</text><text class="a" x="24.0" y="116">captured. Best approach</text><text class="a" x="24.0" y="136">without AI: 82.5%</text>
<rect class="c" x="219.5" y="0.5" width="202.0" height="159" rx="12"/>
<text class="n" x="243.0" y="62">94%</text>
<text class="a" x="243.0" y="96">of denial root causes</text><text class="a" x="243.0" y="116">found correctly</text><text class="a" x="243.0" y="136"></text>
<rect class="c" x="438.5" y="0.5" width="202.0" height="159" rx="12"/>
<text class="n" x="462.0" y="62">0 of 6</text>
<text class="a" x="462.0" y="96">prompt injection</text><text class="a" x="462.0" y="116">attempts succeeded</text><text class="a" x="462.0" y="136"></text>
<rect class="c" x="657.5" y="0.5" width="202.0" height="159" rx="12"/>
<text class="n" x="681.0" y="62">0.018 USD</text>
<text class="a" x="681.0" y="96">API cost per denial,</text><text class="a" x="681.0" y="116">under the 0.02 USD</text><text class="a" x="681.0" y="136">target</text>
</svg>