<svg xmlns="http://www.w3.org/2000/svg" width="860" height="210" viewBox="0 0 860 210" role="img" aria-label="Where the 1,112.98 USD lost on held-out went: 976.69 USD on one write-off that should have been an appeal, 120 USD on 8 reviews at 15 USD each, and 16.29 USD on two small misses on close calls." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
svg{--bg:#FFFFFF;--line:#E3E0F5;--ink:#1F1D2B;--muted:#5E5A72;--bar:#6941E6;--err:#C23434;--mut:#8C8899;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){svg{--bg:#1C1A28;--line:#2E2B40;--ink:#EDEBF7;--muted:#A9A5BE;--bar:#A48BFF;--err:#F07878;--mut:#6E6A80}}
.bg{fill:var(--bg);stroke:var(--line)}.t{fill:var(--ink);font-size:18px;font-weight:600}.st{fill:var(--muted);font-size:13px}
.err{fill:var(--err)}.bar{fill:var(--bar)}.mut{fill:var(--mut)}.v{fill:var(--ink);font-size:14px;font-weight:700}.l{fill:var(--muted);font-size:13px}.r{fill:var(--muted);font-size:12px}
</style>
<rect class="bg" x="0.5" y="0.5" width="859" height="209" rx="16"/>
<text class="t" x="24" y="38">Where the 1,112.98 USD lost on held-out went</text>
<text class="st" x="24" y="60">Money lost against a perfect decision on every one of the 100 denials.</text>
<path class="err" d="M28,82 H733.1 V110 H28 a4,4 0 0 1 -4,-4 V86 a4,4 0 0 1 4,-4 Z"/>
<rect class="bar" x="735.1" y="82" width="87.1" height="28"/>
<path class="mut" d="M824.2,82 H832.0 a4,4 0 0 1 4,4 V106 a4,4 0 0 1 -4,4 H824.2 Z"/>
<rect class="err" x="24" y="134" width="12" height="12" rx="3"/><text class="v" x="44" y="145">976.69 USD</text><text class="l" x="44" y="165">One write-off that should have been an appeal</text>
<rect class="bar" x="330" y="134" width="12" height="12" rx="3"/><text class="v" x="350" y="145">120 USD</text><text class="l" x="350" y="165">8 claims sent to a person, 15 USD each</text>
<rect class="mut" x="600" y="134" width="12" height="12" rx="3"/><text class="v" x="620" y="145">16.29 USD</text><text class="l" x="620" y="165">Two small misses on close calls</text>
<text class="r" x="24" y="194">Source: held-out run in evals/runs. The 976.69 USD is 88% of the total.</text></svg>